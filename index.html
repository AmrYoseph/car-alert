<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>نبّه صاحب العربية</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1d1b18; --muted:#6b665d;
    --accent:#e8590c; --accent-ink:#ffffff; --line:#e4dfd4; --ok:#2b8a3e; --err:#c92a2a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141311; --card:#1e1c19; --ink:#f1ede6; --muted:#a39d92;
           --line:#34302a; --accent:#ff7a2e; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
  main{max-width:440px;margin:0 auto;padding:24px 16px 40px}
  .badge{display:inline-block;background:var(--accent);color:var(--accent-ink);
         font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px}
  h1{font-size:26px;margin:12px 0 4px}
  p.sub{color:var(--muted);margin:0 0 20px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;
       background:var(--card);color:var(--ink);border:2px solid var(--line);
       border-radius:14px;padding:14px 16px;font-size:17px;cursor:pointer;font-family:inherit}
  .opt .ic{font-size:22px}
  .opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  label{display:block;font-weight:600;margin:20px 0 6px}
  label span{color:var(--muted);font-weight:400;font-size:14px}
  textarea{width:100%;min-height:80px;resize:vertical;border:2px solid var(--line);
           border-radius:14px;padding:12px;font:inherit;background:var(--card);color:var(--ink)}
  button.send{margin-top:18px;width:100%;padding:16px;border:0;border-radius:14px;
              background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:700;
              cursor:pointer;font-family:inherit}
  button.send:disabled{opacity:.5;cursor:not-allowed}
  .msg{margin-top:14px;font-weight:600;text-align:center;min-height:1.5em}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .done{display:none;text-align:center;padding:40px 0}
  .done .big{font-size:56px}
  footer{margin-top:28px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<main>
  <section id="form">
    <span class="badge">🚗 تنبيه لصاحب العربية</span>
    <h1>في مشكلة في العربية دي؟</h1>
    <p class="sub">اختار المشكلة وهيوصله تنبيه فورًا على موبايله. رقمه مش هيظهر لك ورقمك مش هيظهر له.</p>

    <div class="opts" id="opts">
      <button class="opt" type="button" data-msg="انت قافل عليا بالعربية، لو سمحت حركها" data-tag="no_entry" aria-pressed="false"><span class="ic">🚧</span>قافل عليا، محتاج يحركها</button>
      <button class="opt" type="button" data-msg="نور عربيتك شغال" data-tag="bulb" aria-pressed="false"><span class="ic">💡</span>نور العربية شغال</button>
      <button class="opt" type="button" data-msg="شباك عربيتك مفتوح" data-tag="window" aria-pressed="false"><span class="ic">🪟</span>الشباك مفتوح</button>
      <button class="opt" type="button" data-msg="حد خبط عربيتك" data-tag="boom" aria-pressed="false"><span class="ic">💥</span>العربية اتخبطت</button>
      <button class="opt" type="button" data-msg="في مشكلة في عربيتك، بص على الملاحظة" data-tag="warning" aria-pressed="false"><span class="ic">⚠️</span>حاجة تانية</button>
    </div>

    <label for="note">ملاحظة <span>(اختياري، ممكن تكتب رقمك لو حابب يكلمك)</span></label>
    <textarea id="note" maxlength="200" placeholder="مثلاً: قافل مدخل الجراج"></textarea>

    <button class="send" id="send" disabled>ابعت التنبيه</button>
    <div class="msg" id="msg" role="status"></div>
  </section>

  <section class="done" id="done">
    <div class="big">✅</div>
    <h1>التنبيه وصل</h1>
    <p class="sub">شكرًا ليك، صاحب العربية جاله إشعار دلوقتي.</p>
  </section>

  <footer>صفحة شخصية لتنبيه صاحب العربية</footer>
</main>

<script>
  // ===== الإعدادات =====
  const TOPIC = "car-9e20c05a370443ba";   // اسم القناة الخاصة بيك في ntfy
  // =====================

  const opts = document.querySelectorAll(".opt");
  const sendBtn = document.getElementById("send");
  const note = document.getElementById("note");
  const msg = document.getElementById("msg");
  let chosen = null;

  // لو الموبايل ده بعت قبل كدا، اعرض رسالة إن التنبيه اتبعت ومتسمحش بإرسال تاني
  if (lastSent() > 0){
    document.getElementById("form").style.display = "none";
    document.getElementById("done").style.display = "block";
    document.querySelector("#done .sub").textContent = "انت بعت تنبيه قبل كدا من الموبايل ده، وصاحب العربية وصله.";
  }

  opts.forEach(b => b.addEventListener("click", () => {
    opts.forEach(o => o.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    chosen = b;
    sendBtn.disabled = false;
    msg.textContent = ""; msg.className = "msg";
  }));

  function lastSent(){ try { return +localStorage.getItem("lastSent") || 0; } catch(e){ return 0; } }
  function markSent(){ try { localStorage.setItem("lastSent", Date.now()); } catch(e){} }

  sendBtn.addEventListener("click", async () => {
    if (!chosen) return;
    if (lastSent() > 0){
      msg.className = "msg err";
      msg.textContent = "انت بعت تنبيه قبل كدا من الموبايل ده، وصاحب العربية وصله.";
      sendBtn.disabled = true;
      return;
    }
    const extra = note.value.trim();
    const body = chosen.dataset.msg + (extra ? "\n📝 " + extra : "");
    sendBtn.disabled = true;
    msg.className = "msg"; msg.textContent = "جاري الإرسال...";
    try{
      const r = await fetch("https://ntfy.sh/", {
        method: "POST",
        body: JSON.stringify({
          topic: TOPIC,
          title: "🚗 الحق عربيتك!",
          message: body,
          priority: 5,
          tags: [chosen.dataset.tag]
        })
      });
      if (!r.ok) throw new Error(r.status);
      markSent();
      document.getElementById("form").style.display = "none";
      document.getElementById("done").style.display = "block";
    }catch(e){
      sendBtn.disabled = false;
      msg.className = "msg err";
      msg.textContent = "حصلت مشكلة في الإرسال، جرّب تاني بعد شوية.";
    }
  });
</script>
</body>
</html>
